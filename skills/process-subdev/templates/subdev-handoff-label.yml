name: Sub-dev Handoff Label

# TEMPLATE shipped by the airuleset `process-subdev` skill (#21) — copy into
# the repo's .github/workflows/ and adjust the author allow-list. The canonical
# process lives in the skill; this file is the repo-side label automation.

# Sub-dev streams signal a finished hand-off by COMMENTING on the upstream issue
# ("Ready for gatekeeper cross-fork review" / READY-FOR-REVIEW) — david cannot add
# labels (read-only collaborator), montalu comments via a scoped PAT under the
# zbynekdrlik account. Nothing used to watch those comments, so hand-offs sat
# invisible until the user relayed them by hand.
# This workflow turns the comment into the durable queue signal: it adds the
# `ready-for-review` label, and the gatekeeper's queue is simply
#   gh issue list --label ready-for-review --state open
# The label is removed when the gatekeeper merges/closes the ticket.
#
# #331: the SAME comment-watching mechanism also covers two more marker
# types, each its OWN dedicated step so none of the three signals can
# collide with or shadow another: a stream blocked on something only the
# gatekeeper can do comments `GATEKEEPER-ACTION: <what is needed>` and this
# workflow adds `needs-gatekeeper` — the SAME label/convention
# `airuleset.py gk-request` degrades to when it lacks push access to label
# directly, so job 11's `in:title`/label queries already watch for it; and
# a stream resolving a bounce that lives on a DEDICATED tracking issue (not
# the ticket carrying the actual fix, so the ready-for-review step's own
# same-issue prio:bounce clear below never fires for it) comments
# `BOUNCE-RESOLVED: <what was fixed>` on that tracking issue to have this
# automation clear the label on their behalf (read-only sub-devs cannot
# remove labels themselves).
#
# NOTE: the readiness condition lives at STEP level, not job level — the repo's
# "No Skip Validation" CI gate forbids job-level `if:` in every workflow file.
#
# #1500: the step `if:` is only a COARSE pre-filter (GitHub expressions have no
# anchoring/regex — a bare contains() falsely labeled on a gatekeeper comment
# that merely MENTIONED the marker mid-sentence, live incident 2026-07-14 on
# #1489). The precise decision is scripts/subdev-handoff-match.sh: label ONLY a
# line-start READY-FOR-REVIEW marker or the full cross-fork-review phrase (mode
# "ready-for-review", the default) — a line-start GATEKEEPER-ACTION: marker
# (mode "gatekeeper-action") — or a line-start BOUNCE-RESOLVED: marker (mode
# "bounce-resolved"). Same anchoring discipline for all three.

on:
  issue_comment:
    types: [created]

permissions:
  # contents: read is LOAD-BEARING — a restrictive permissions block zeroes
  # every unlisted scope, and actions/checkout on this PRIVATE repo fails
  # without it; a failed checkout skips the label step (implicit success()),
  # silently disabling the whole queue signal.
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (matcher script)
        # Same coarse pre-filter as the label steps below — skip the checkout
        # for the overwhelming majority of comments that can never label.
        if: >-
          !github.event.issue.pull_request &&
          contains(fromJSON('["kvaskodev", "zbynekdrlik"]'), github.event.comment.user.login) &&
          (contains(github.event.comment.body, 'READY-FOR-REVIEW') ||
           contains(github.event.comment.body, 'Ready for gatekeeper') ||
           contains(github.event.comment.body, 'GATEKEEPER-ACTION') ||
           contains(github.event.comment.body, 'BOUNCE-RESOLVED'))
        uses: actions/checkout@v4
      - name: Add ready-for-review label
        # Only real issues (not PR comments), only sub-dev authors, only readiness phrasing.
        if: >-
          !github.event.issue.pull_request &&
          contains(fromJSON('["kvaskodev", "zbynekdrlik"]'), github.event.comment.user.login) &&
          (contains(github.event.comment.body, 'READY-FOR-REVIEW') ||
           contains(github.event.comment.body, 'Ready for gatekeeper'))
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          # Body via env, never shell-interpolated — comment text is untrusted input.
          BODY: ${{ github.event.comment.body }}
          # #1056 L2 (g): the RFR comment's own timestamp + the gatekeeper login
          # for the bounce-clear guard below. GATEKEEPER_LOGIN is a repo variable
          # (Settings ▸ Variables); it defaults to the fleet gatekeeper identity.
          RFR_TS: ${{ github.event.comment.created_at }}
          GK_LOGIN: ${{ vars.GATEKEEPER_LOGIN || 'zbynekdrlik' }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$BODY" | bash scripts/subdev-handoff-match.sh; then
            echo "Marker mentioned but not a readiness hand-off (#1500) — leaving labels unchanged."
            exit 0
          fi
          gh label create ready-for-review \
            --repo "$REPO" --color 0e8a16 \
            --description "Sub-dev hand-off complete — waiting on gatekeeper cross-fork review" \
            2>/dev/null || true
          gh issue edit "$NUM" --repo "$REPO" --add-label ready-for-review
          # Re-ready after a bounce = the bounce is resolved. A read-role
          # sub-dev CANNOT remove labels, so the repo automation clears the
          # lane here (airuleset #21; the 2026-07-19 stale-label incident).
          #
          # #1056 L2 (g): clear prio:bounce ONLY when THIS RFR genuinely answers
          # the newest gk BOUNCE — the RFR is newer than that verdict AND a
          # commit landed since it. The blind re-flag class (montalu, odoo-erp
          # #5613/#6890): RFR re-posted minutes after a BOUNCE with the PR head
          # unchanged → clearing hands a still-broken ticket back as "ready".
          # gh api reads HERE (author = the gk login var); the pure decision is
          # scripts/subdev-handoff-match.sh bounce-clear-guard, which compares
          # the actual comment/commit timestamps (the replay guard = the
          # processed comments' own created_at, never a now-2h window). Every
          # read is best-effort: a resolution miss leaves GK_TS empty → the guard
          # treats it as "no BOUNCE → clear" (backward-compatible), and the
          # gk-side revert automat (#1056 L2 (h)) is the server-side backstop.
          GK_TS="$(gh api "repos/$REPO/issues/$NUM/comments" --paginate \
            -q '.[] | select(.user.login == env.GK_LOGIN)
                    | select(.body | test("(?im)^\\s*([#*_-]+\\s*)?READY-FOR-REVIEW") | not)
                    | select(.body | test("gk-state:\\s*BOUNCE|\\bBOUNCE\\b"; "i"))
                    | .created_at' 2>/dev/null | sort | tail -1 || true)"
          COMMIT_TS=""
          PR_OID="$(gh pr list --repo "$REPO" --search "$NUM" --state all \
            --json number,headRefOid,body -L 20 2>/dev/null \
            | jq -r '.[] | select(.body | test("(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#"+env.NUM+"\\b")) | .headRefOid' \
            | head -1 || true)"
          if [ -n "$PR_OID" ]; then
            COMMIT_TS="$(gh api "repos/$REPO/commits/$PR_OID" -q '.commit.author.date' 2>/dev/null || true)"
          fi
          if bash scripts/subdev-handoff-match.sh bounce-clear-guard "$RFR_TS" "$GK_TS" "$COMMIT_TS"; then
            gh issue edit "$NUM" --repo "$REPO" --remove-label prio:bounce 2>/dev/null || true
          else
            echo "prio:bounce NOT cleared (#1056 L2): this RFR does not answer the newest gk BOUNCE with a new commit — the gk queue keeps the bounce until a real fix."
          fi
      - name: Add needs-gatekeeper label (#331)
        # Only real issues (not PR comments), only sub-dev authors, only the
        # GATEKEEPER-ACTION: request marker — never disturbs the
        # ready-for-review path above, since the two live as separate matcher
        # modes reading the SAME comment for two different signals.
        if: >-
          !github.event.issue.pull_request &&
          contains(fromJSON('["kvaskodev", "zbynekdrlik"]'), github.event.comment.user.login) &&
          contains(github.event.comment.body, 'GATEKEEPER-ACTION')
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          # Body via env, never shell-interpolated — comment text is untrusted input.
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$BODY" | bash scripts/subdev-handoff-match.sh gatekeeper-action; then
            echo "Marker mentioned but not a genuine gatekeeper-action request (#331) — leaving labels unchanged."
            exit 0
          fi
          gh label create needs-gatekeeper \
            --repo "$REPO" --color D93F0B \
            --description "Stream needs a gatekeeper/supervisor action (access, dispatch, infra)" \
            2>/dev/null || true
          gh issue edit "$NUM" --repo "$REPO" --add-label needs-gatekeeper
      - name: Remove prio:bounce label — BOUNCE-RESOLVED marker (#331)
        # A dedicated bounce-tracking issue can be resolved by a fix landing
        # on a DIFFERENT issue entirely, so the "Add ready-for-review label"
        # step's same-issue prio:bounce clear (above) never fires for it —
        # and a read-only sub-dev collaborator 403s trying to remove the
        # label itself. A stream comments BOUNCE-RESOLVED: directly on the
        # tracking issue to have this repo automation clear it on their
        # behalf.
        if: >-
          !github.event.issue.pull_request &&
          contains(fromJSON('["kvaskodev", "zbynekdrlik"]'), github.event.comment.user.login) &&
          contains(github.event.comment.body, 'BOUNCE-RESOLVED')
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          # Body via env, never shell-interpolated — comment text is untrusted input.
          BODY: ${{ github.event.comment.body }}
          # #1056 L2 (g): same bounce-clear guard as the ready-for-review step.
          RFR_TS: ${{ github.event.comment.created_at }}
          GK_LOGIN: ${{ vars.GATEKEEPER_LOGIN || 'zbynekdrlik' }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$BODY" | bash scripts/subdev-handoff-match.sh bounce-resolved; then
            echo "Marker mentioned but not a genuine bounce-resolved notice (#331) — leaving labels unchanged."
            exit 0
          fi
          # #1056 L2 (g): gate the clear exactly like the ready-for-review step.
          # A dedicated tracking issue usually carries NO gk BOUNCE of its own
          # (the fix + the verdict live on another issue), so GK_TS resolves
          # empty here → the guard clears (backward-compatible). It engages only
          # when the gk bounced THIS tracking issue itself and no response
          # landed. gh reads best-effort; a miss → empty GK_TS → clear.
          GK_TS="$(gh api "repos/$REPO/issues/$NUM/comments" --paginate \
            -q '.[] | select(.user.login == env.GK_LOGIN)
                    | select(.body | test("(?im)^\\s*([#*_-]+\\s*)?READY-FOR-REVIEW") | not)
                    | select(.body | test("gk-state:\\s*BOUNCE|\\bBOUNCE\\b"; "i"))
                    | .created_at' 2>/dev/null | sort | tail -1 || true)"
          COMMIT_TS=""
          PR_OID="$(gh pr list --repo "$REPO" --search "$NUM" --state all \
            --json number,headRefOid,body -L 20 2>/dev/null \
            | jq -r '.[] | select(.body | test("(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#"+env.NUM+"\\b")) | .headRefOid' \
            | head -1 || true)"
          if [ -n "$PR_OID" ]; then
            COMMIT_TS="$(gh api "repos/$REPO/commits/$PR_OID" -q '.commit.author.date' 2>/dev/null || true)"
          fi
          # Best-effort: a ticket that never carried prio:bounce (or a
          # read-role token hiccup) must not fail this job.
          if bash scripts/subdev-handoff-match.sh bounce-clear-guard "$RFR_TS" "$GK_TS" "$COMMIT_TS"; then
            gh issue edit "$NUM" --repo "$REPO" --remove-label prio:bounce 2>/dev/null || true
            echo "BOUNCE-RESOLVED on #$NUM — prio:bounce removed (or was already absent)."
          else
            echo "BOUNCE-RESOLVED on #$NUM — prio:bounce NOT cleared (#1056 L2): a newer gk BOUNCE stands on this issue with no verified fix since."
          fi
      - name: No-op marker (job never skips)
        run: echo "handoff-label evaluated"
