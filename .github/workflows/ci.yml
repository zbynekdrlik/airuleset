name: CI

# #683 — the repo's first GitHub Actions workflow. Makes the fleet-wide
# "main CI green" proof (gh run list -b main == success) satisfiable for
# airuleset. Mirrors the local integration gate: ruff, size_ratchet, and the
# HERMETIC subset of the pytest suite. Runs in a pinned `python:3.12`
# container so the CI environment is reproducible and IDENTICAL to where the
# hermetic subset was empirically measured (see the #683 design comment).
#
# wip refs (refs/autopilot-wip/*) deliberately do NOT trigger this — they are
# durability backups, not integration. The `pull_request` trigger runs this on
# a dev→main PR (a PR that adds a workflow runs that new workflow on the PR),
# so it gates BEFORE main when a PR is opened; the push-to-main run is the
# backstop when a branch is merged without a PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Container jobs default to `sh`, not bash — the pytest step uses `mapfile`
# (a bashism), which made the first main run die with exit 127 (`mapfile:
# not found`). Every run step here assumes bash; pin it explicitly.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # The FULL python:3.12 image (buildpack-deps base) deliberately, NOT
      # -slim: actions/checkout uses git when present and many tests need a
      # real .git; the full image ships git (and apt for the jq step below).
      image: python:3.12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: tests/test_rules_ab_experiment.py replays real
          # historical commit pairs; a shallow clone fails it ("not a commit").
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: |
          # The container runs as uid 0 while the bind-mounted workspace is
          # owned by the host runner uid — every git call needs safe.directory.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # `git clone <workspace>` (tests/test_rules_ab_experiment.py's
          # make_tree) opens the SOURCE repo at <workspace>/.git — an
          # EXACT-path safe.directory match the workspace entry alone does
          # not cover (run 32836799214: `fatal: detected dubious ownership
          # in repository at '.../.git'`).
          git config --global --add safe.directory "$GITHUB_WORKSPACE/.git"

      - name: Install jq (hooks under test parse their payload with jq)
        run: |
          apt-get update -qq
          apt-get install -y -qq jq
          jq --version

      - name: Install Python test tooling
        run: pip install --no-input pytest==8.3.2 ruff==0.16.2

      - name: Ruff lint
        run: ruff check .

      - name: Size ratchet (growth-only cap on file/function size)
        run: python3 scripts/size_ratchet.py --check

      - name: CI identity (for #839 authority resolution)
        # airuleset#839: GitHub does NOT forward RUNNER_ENVIRONMENT into a
        # container job (its `docker create` forwards only HOME/GITHUB_ACTIONS/
        # CI — 0 occurrences of RUNNER_ENVIRONMENT in the run-33596134863 job
        # log). airuleset's authority resolver recognises this repo's OWN CI
        # (to grant the full-authority CLI behaviour the hermetic tests assume)
        # by uid 0 + GITHUB_ACTIONS + RUNNER_ENVIRONMENT=github-hosted, so make
        # the last one visible. `runner.environment` is a STEP-level context
        # ("github-hosted" on a hosted runner; NOT available at job-level env)
        # injected into this step's env, so a self-hosted runner would carry
        # "self-hosted" and stay reduced (the design's fail-safe discriminator).
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          # PRINT the identity + hosted-CI env the authority resolver keys on,
          # so the next investigator never has to INFER it from the container
          # create line again (attempt 1's failure mode). This is a print, not
          # a gate: the `|| true` keeps a non-zero probe from failing the step
          # from inside the run script (no workflow-level failure-exemption key
          # is used anywhere — that is banned in this repo's CI).
          id -un; id -u
          env | grep -E '^(GITHUB_ACTIONS|RUNNER_ENVIRONMENT|CI)=' || true
          python3 airuleset.py authority --explain || true

      - name: Pytest — hermetic subset
        # airuleset#839: the pytest step (and its `_run_quals` subprocesses that
        # shell out to core-quals / tickets-status / run-card) resolve authority
        # as the container's uid 0 / root, so RUNNER_ENVIRONMENT must be visible
        # HERE too (step-level `runner.environment`, same reason as the identity
        # step above) or the FULL-authority-gated subset stays RED.
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          # Write args to a file FIRST so a failing generator fails the step
          # (a `mapfile < <(...)` process substitution swallows the child's
          # exit code — an unreadable deny-list would otherwise pass silently
          # into an empty selection). Under `set -eo pipefail` the redirect
          # command fails loudly if the generator exits non-zero.
          python3 scripts/ci_pytest_args.py .github/box-bound-tests.txt > pytest-selection.args
          mapfile -t ARGS < pytest-selection.args
          printf 'pytest selection arg: %s\n' "${ARGS[@]}"
          python3 -m pytest tests/ "${ARGS[@]}" \
            -p no:cacheprovider -o addopts="" -q --junitxml=junit.xml

      - name: Collected-count guard (a no-op test job is banned)
        run: python3 scripts/ci_assert_collected.py junit.xml 5000
