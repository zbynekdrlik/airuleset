# #95 item 12 root-cause re-measure (2026-08-15) — the same gap the first
# item-12 pass closed for fast-iterate/meeting-analysis/playbook-cleanup,
# now closed for the three model-visible skills that were added AFTER that
# pass and so never got a trigger row: cloudflare-api-tokens (#filed from
# the spinbike DNS incident), claude-code-log (#420) and odoo-discuss-xmlrpc
# (#465). The 2026-08-15 injection re-measure found all three at ZERO reach
# on dev1 — but none is a delete candidate: each has a validated reason (the
# first two are rare-but-real maintainer tasks with no action trigger; the
# third belongs to the odoo/montalu streams, not this box). The FREEZE-safe
# fix is the SAME as item 12 — a real action trigger from each skill's own
# "when to use" text so the body loads at the one moment it matters, instead
# of relying on the model volunteering a Skill call (#91's failure).
#
# #631 (2026-08-22) — the cloudflare row is now a RAW_BASH_MATCH_TOPICS row in
# inject-situational-rule.sh: it matches the RAW command (quotes + heredoc
# bodies KEPT), NOT the strip_carried_text()-stripped haystack. The old
# "quoted CF URL is stripped so the reliable catch is the UNQUOTED URL" note
# was the bug — a token-verifying script calls api.cloudflare.com from inside a
# quoted Python/heredoc string, so the stripped haystack erased the one shape
# that most needs the skill, and the owner lost his master token (see the
# #631/#500 prod-capitulation sibling in stop-check-prose-violations.sh). So
# the pattern below now ALSO catches the quoted/heredoc URL, the cfat_ prefix,
# a `secret request/exec cloudflare*`, a read of ~/.secrets/cloudflare*, and
# `webterm-access` (= Cloudflare Access config, cli_webterm_access.py). Cost:
# a commit MESSAGE merely MENTIONING one of these now injects too (raw match) —
# an accepted, cheap false-positive (one deferred injection once per session),
# the deliberate fail-toward-inject direction for a credential whose false
# NEGATIVE is irreversible. odoo/claude-code-log stay stripped-haystack rows,
# so their MENTION false-positives are unaffected. odoo binds to
# Write|Edit ONLY — a Bash surface caught `grep message_post` far more than any
# real post, and a real python `message_post` call is quote-stripped anyway, so
# the reliable catch is the token in the Write|Edit CONTENT (authoring the
# script); claude-code-log's `session` arms REQUIRE an html/markdown format so
# they no longer fire on "export a session cookie" / "session data to CSV" /
# "browse the session logs" / "archive this session", while the transcript /
# `claude-code-log` / "token usage across session" arms stay format-free.
# Re-measure again in a few weeks; withdraw only what still delivers nothing
# WITH the trigger (comment 5230729320's own rule).
cloudflare-api-tokens	Bash	api\.cloudflare\.com|(^|[^a-z])wrangler([^a-z]|$)|CLOUDFLARE_API_TOKEN|CF_API_TOKEN|cfat_|\.secrets/cloudflare|secret\s+(request|exec)[^\n]{0,60}cloudflare|webterm-access	skills/cloudflare-api-tokens/SKILL.md
