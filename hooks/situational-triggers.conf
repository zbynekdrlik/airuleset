# airuleset situational-rule trigger table (#91)
#
# Read by hooks/inject-situational-rule.sh. Each row binds a body of converted
# rule content to the ACTION that makes it relevant, so the content loads
# WITHOUT the model having to volunteer a `Skill` call — the failure #91
# documents (25 of 34 skills had zero lifetime invocations; 0 of 37 real
# `gh pr merge` transcripts ever loaded pr-merge-policy).
#
# Format — TAB-separated, four columns:
#
#   topic    a stable id; also the once-per-session dedup key
#   tool     ERE matched against the tool name (`Bash`, `Agent`, `Write`,
#            `mcp__win-.*`), or the literal `UserPromptSubmit` for the
#            prompt-text surface
#   pattern  ERE matched against the compact JSON of tool_input (for
#            UserPromptSubmit: against the prompt text)
#   body     repo-relative file whose content is injected (frontmatter stripped)
#   exclude  OPTIONAL 5th column: an ERE that VETOES a match (e.g. test files)
#
# Content bound to a FILE TYPE usually belongs in rules/*.md with `paths:`
# frontmatter instead — Claude Code injects those automatically as a
# `nested_memory` attachment. But that surface fires on **Read / @-mention /
# IDE-open only**: Edit and Write do NOT trigger it (confirmed in the CC
# 2.1.220 bundle — only the Read tool pushes nestedMemoryAttachmentTriggers).
# So content that must land when the model is about to WRITE code
# (comprehensive-logging, version-on-dashboard) is triggered from here on the
# Write/Edit tools rather than from rules/.

pr-merge-policy	Bash	gh pr (merge|create)	skills/pr-merge-policy/SKILL.md
ci-push-discipline	Bash	git push	skills/ci-push-discipline/SKILL.md
ci-monitor	Bash	gh run (view|list|watch)|gh pr checks	skills/ci-monitor/SKILL.md
deploy-ssh	Bash	(^|[^a-z])(rsync|scp|sftp|sshpass)([^a-z]|$)	skills/deploy-ssh/SKILL.md
post-deploy-verification	Bash	(^|[^a-z])(rsync|scp|sftp|sshpass)([^a-z]|$)	skills/post-deploy-verification/SKILL.md
local-builds	Bash	cargo (build|test|run)|npm run build|yarn build|docker build|trunk build	skills/local-builds/SKILL.md
mutation-testing	Bash	cargo mutants|stryker	skills/mutation-testing/SKILL.md
verify-issue-still-valid	Bash	gh issue view	skills/verify-issue-still-valid/SKILL.md
batch-issue-development	Bash	gh issue list	skills/batch-issue-development/SKILL.md
regression-test-first	Bash	git commit.*(fix|bug|hotfix|regression|patch)	skills/regression-test-first/SKILL.md
verify-launched-work-liveness	Bash	run_in_background=true	skills/verify-launched-work-liveness/SKILL.md
deliver-files-as-urls	Bash	airuleset\.py (share|upload)	skills/deliver-files-as-urls/SKILL.md
notification-mechanics	Bash	airuleset\.py notify|notify-discord	skills/notification-mechanics/SKILL.md
subagent-type-discipline	Agent	.	skills/subagent-type-discipline/SKILL.md
investigate-existing-first	Write	__manifest__\.py|setup\.py|pyproject\.toml|Cargo\.toml	skills/investigate-existing-first/SKILL.md
comprehensive-logging	Write|Edit	\.(py|rs|ts|js|go|java|rb)\"	skills/comprehensive-logging/SKILL.md	/tests?/|/spec/|"[^"]*/(test_|conftest)|\.(test|spec)\.
version-on-dashboard	Write|Edit	\.(tsx|jsx|vue|svelte)\"|index\.html\"	skills/version-on-dashboard/SKILL.md
windows-remote-gui	mcp__win-.*	.	skills/windows-remote-gui/SKILL.md
view-image-urls	UserPromptSubmit	(prnt\.sc|imgur\.com|gyazo|ibb\.co|\.(png|jpe?g|webp|gif)([?#]|$))	skills/view-image-urls/SKILL.md
fable-advisor	Bash	airuleset\.py fable-gate	skills/fable-advisor/SKILL.md

