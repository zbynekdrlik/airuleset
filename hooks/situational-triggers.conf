# #521 (2026-08-17) — the handover-PROPOSAL composition rules unified for ALL
# sub-dev streams live in skills/odoo-discuss-xmlrpc/handover-compose.md (a
# companion of the odoo-discuss-xmlrpc skill, kept SEPARATE from SKILL.md so the
# posting recipe stays lean and always co-fits with comprehensive-logging at
# message_post-code time — the split-body fix for the co-injection budget). This
# row loads the composition rules at PROPOSAL time — when the owner/user asks to
# prepare a client handover Discuss thread (UserPromptSubmit), and at the owner-
# approval moment for a main-session stream (AskUserQuestion). Pattern arms: an
# odovzdáv/handover verb near a Discuss/vlákno/klient signal (either order), OR a
# napíš/informuj/oznám/ohlás verb near BOTH a klient and a Discuss/vlákno — tuned
# so a bare deploy instruction ("odovzdaj na prod") never fires.
#
# #577 — a BARE FOLLOW-UP in an existing thread carries neither an odovzd/handover
# word nor both signals at once ("odpovedz klientovi" = reply+client, no thread;
# "napíš im do vlákna" = write+thread, no client), the exact scenario the #573
# greeting-only-in-first-message rule governs. Four more arms catch it: a
# write/reply verb (Slovak reply odpoved/odpíš/reaguj + the napíš/informuj/oznám/
# ohlás write set) near a Discuss/vlákno signal (both orderings), AND a Slovak
# REPLY verb near a klient/client/zákazn signal (both orderings). WRITE verbs still
# require a thread signal, so "napíš klientovi email" (write+client, no thread)
# stays silent (the locked negative); deploy prompts stay silent (no thread/client
# near a follow-up verb). The follow-up proximity gap is a tight [^\n]{0,40}.
#
# #577 review hardening: (1) English reply verbs (reply/respond) were dropped — the
# streams work in Slovak, and reply/respond over-fired on daily English dev prose
# (reply/respond to the PR/discussion/client) AND on substrings (correspond,
# respondent, no-reply); a rare English handover phrasing still loads via the other
# paths (same-session context, the .py message_post write, AskUserQuestion). (2)
# EVERY verb stem lost its trailing \w* — a \w* verb prefix next to the [^\n]{0,N}
# gap (both match word chars) is catastrophic-backtracking ReDoS on a repeated
# verb-token input ("odpoved"×1000 → ~9 s; "odovzdav"×1000 → ~14 s, a PRE-EXISTING
# vuln in arms 1-3 too). Bare stems match the same prompts (re.search finds the
# stem substring) at <10 ms and are cross-version safe — a possessive \w*+ / atomic
# (?>\w*) would re.error on Python <3.11 and the injector's `except re.error` would
# SILENTLY DISABLE the whole row on an older box.
#
# ACCEPTED RESIDUALS (#319 convention — honestly stated, not hidden):
#  - A background autopilot-worker stream composes the proposal in a ❓ PROSE
#    marker (assistant text, no tool call) — NO PreToolUse hook fires, so neither
#    this row nor the message_post row delivers at that exact moment. The rules
#    still reach it via an earlier UserPromptSubmit/Write in the same session, or
#    a subsequent action (defer-not-consume). The reliable catch is a Stop-gate
#    that checks a handover-proposal's SHAPE — deliberately NOT built here (a new
#    hook is out of #521's scope); tracked as follow-up.
#  - AskUserQuestion co-fires with the always-on user-questions-slovak row; that
#    row (~14KB) can consume the MAX_TOTAL budget on the session's FIRST
#    AskUserQuestion, deferring this one — but its marker is left unset so it
#    loads on the next action, and every LATER handover AskUserQuestion (after
#    user-questions-slovak's marker is set) injects it alone.
#  - #577: the follow-up arms fire on a reply/write verb near a LONE "vlákno"/
#    "discuss" or "klient" signal, so a generic non-odoo Slovak thread reply
#    ("odpovedz vo vlákne na fóre", "napíš do vlákna na GitHube"), a reply-to-
#    client out of any thread ("odpovedz klientovi telefonicky"), or an odpoved-
#    NOUN form ("odpovede klientovi") over-injects the companion once per session
#    — a cheap, self-deferring context add, accepted as the fail-toward-inject
#    direction (a false-negative loses the composition rules on a real follow-up,
#    a false-positive is one deferrable injection). handover is the LAST conf row,
#    so an over-budget co-fire can only ever defer ITSELF, never displace another
#    row.
#  - A genuinely exotic phrasing outside the verb/keyword families can still miss
#    (same bounded-word-family limit #319 documents for its own detectors).
# #859 batch 3 (A2 re-tiering) — statusline deep state-machine detail, split into
# two companion bodies (DEEP-1: I+U+gk ≈ 8 KB; DEEP-2: W ≈ 22 KB) because the
# combined ~30 KB exceeds MAX_BODY=24000. Fires when a session runs qualification
# commands or asks about the footer. On a Bash quals co-fire, DEEP-2 row comes
# FIRST in conf order, so it injects (~22 KB); DEEP-1 (~8 KB) then exceeds
# MAX_TOTAL and defers to the next action (marker unset). On a UserPromptSubmit,
# W-specific prompts ("W 34?") fire DEEP-2's prompt arm alone (DEEP-1's prompt
# arm does not match); I/U/gk/footer prompts fire DEEP-1's prompt arm alone
# (DEEP-2's prompt arm does not match). Net: a W question gets the W body;
# an I/U question gets the I+U+gk body; a quals command gets DEEP-2 first,
# DEEP-1 deferred.
statusline-deep-2	Bash	tickets-status|core-quals|slice-quals|wdrain-pass	skills/statusline-vocabulary-deep/DEEP-2.md
statusline-deep-2-prompt	UserPromptSubmit	(?i)(W \d+\??|wdrain|ops.?wait)	skills/statusline-vocabulary-deep/DEEP-2.md
statusline-deep-1	Bash	tickets-status|core-quals|slice-quals|wdrain-pass	skills/statusline-vocabulary-deep/DEEP-1.md
statusline-deep-1-prompt	UserPromptSubmit	(?i)(I \d+|issues? \d+|U \d+\??|otázky na m[ňn]a|p[äa]ti[čc]k|statusline|footer|gk \d+)	skills/statusline-vocabulary-deep/DEEP-1.md

