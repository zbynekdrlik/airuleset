# #95 item 12 root-cause re-measure (2026-08-15) — the same gap the first
# item-12 pass closed for fast-iterate/meeting-analysis/playbook-cleanup,
# now closed for the three model-visible skills that were added AFTER that
# pass and so never got a trigger row: cloudflare-api-tokens (#filed from
# the spinbike DNS incident), claude-code-log (#420) and odoo-discuss-xmlrpc
# (#465). The 2026-08-15 injection re-measure found all three at ZERO reach
# on dev1 — but none is a delete candidate: each has a validated reason (the
# first two are rare-but-real maintainer tasks with no action trigger; the
# third belongs to the odoo/montalu streams, not this box). The FREEZE-safe
# fix is the SAME as item 12 — a real action trigger from each skill's own
# "when to use" text so the body loads at the one moment it matters, instead
# of relying on the model volunteering a Skill call (#91's failure). Each
# pattern is validated against the injector's own quote-stripping (a quoted CF
# URL is stripped from a Bash haystack, so cloudflare's reliable catch is the
# UNQUOTED api.cloudflare.com URL / wrangler CLI / the env-var names) and
# against real false positives (adversarial review, this pass): odoo binds to
# Write|Edit ONLY — a Bash surface caught `grep message_post` far more than any
# real post, and a real python `message_post` call is quote-stripped anyway, so
# the reliable catch is the token in the Write|Edit CONTENT (authoring the
# script); claude-code-log's `session` arms REQUIRE an html/markdown format so
# they no longer fire on "export a session cookie" / "session data to CSV" /
# "browse the session logs" / "archive this session", while the transcript /
# `claude-code-log` / "token usage across session" arms stay format-free.
# Re-measure again in a few weeks; withdraw only what still delivers nothing
# WITH the trigger (comment 5230729320's own rule).
cloudflare-api-tokens	Bash	api\.cloudflare\.com|(^|[^a-z])wrangler([^a-z]|$)|CLOUDFLARE_API_TOKEN|CF_API_TOKEN	skills/cloudflare-api-tokens/SKILL.md
odoo-discuss-xmlrpc	Write|Edit	message_post	skills/odoo-discuss-xmlrpc/SKILL.md
claude-code-log	UserPromptSubmit	(?i)(browse|export|archive).{0,25}transcript|transcript.{0,20}(as )?(html|markdown)|token usage across session|claude-code-log|(export|archive).{0,20}(this |the |a )?session\b.{0,15}(html|markdown)|(prehli|exportuj|archivuj|zobraz).{0,20}(transkript|session\b.{0,15}html)	skills/claude-code-log/SKILL.md

# #521 (2026-08-17) — the handover-PROPOSAL composition rules unified for ALL
# sub-dev streams live in skills/odoo-discuss-xmlrpc/handover-compose.md (a
# companion of the odoo-discuss-xmlrpc skill, kept SEPARATE from SKILL.md so the
# posting recipe stays lean and always co-fits with comprehensive-logging at
# message_post-code time — the split-body fix for the co-injection budget). This
# row loads the composition rules at PROPOSAL time — when the owner/user asks to
# prepare a client handover Discuss thread (UserPromptSubmit), and at the owner-
# approval moment for a main-session stream (AskUserQuestion). Pattern arms: an
# odovzdáv/handover verb near a Discuss/vlákno/klient signal (either order), OR a
# napíš/informuj/oznám/ohlás verb near BOTH a klient and a Discuss/vlákno — tuned
# so a bare deploy instruction ("odovzdaj na prod") never fires.
#
# ACCEPTED RESIDUALS (#319 convention — honestly stated, not hidden):
#  - A background autopilot-worker stream composes the proposal in a ❓ PROSE
#    marker (assistant text, no tool call) — NO PreToolUse hook fires, so neither
#    this row nor the message_post row delivers at that exact moment. The rules
#    still reach it via an earlier UserPromptSubmit/Write in the same session, or
#    a subsequent action (defer-not-consume). The reliable catch is a Stop-gate
#    that checks a handover-proposal's SHAPE — deliberately NOT built here (a new
#    hook is out of #521's scope); tracked as follow-up.
#  - AskUserQuestion co-fires with the always-on user-questions-slovak row; that
#    row (~14KB) can consume the MAX_TOTAL budget on the session's FIRST
#    AskUserQuestion, deferring this one — but its marker is left unset so it
#    loads on the next action, and every LATER handover AskUserQuestion (after
#    user-questions-slovak's marker is set) injects it alone.
#  - A genuinely exotic phrasing outside the verb/keyword families can still miss
#    (same bounded-word-family limit #319 documents for its own detectors).
odoo-discuss-handover	UserPromptSubmit|AskUserQuestion	(?i)(odovzd[aá]v\w*|odovzdaj\w*|handover)[^\n]{0,80}(discuss|vl[aá]kn|klient|client)|(discuss|vl[aá]kno)[^\n]{0,40}(odovzd|handover)|(nap[ií]š\w*|napis\w*|informuj\w*|ozn[aá]m\w*|ohl[aá]s\w*)[^\n]{0,60}((klient|client|z[aá]kazn)[^\n]{0,60}(discuss|vl[aá]kn)|(discuss|vl[aá]kn)[^\n]{0,60}(klient|client|z[aá]kazn))	skills/odoo-discuss-xmlrpc/handover-compose.md
